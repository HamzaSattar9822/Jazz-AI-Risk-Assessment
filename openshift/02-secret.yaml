# Apply after editing JWT_SECRET (and optional LLM / mail overrides).
#   oc -n ai-risk create secret generic aira-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: aira-secrets
  namespace: ai-risk
  labels:
    app: jazz-ai-risk-assessment
type: Opaque
stringData:
  JWT_SECRET: change-me-before-prod
